[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "against-yesterday"
version = "0.1.0"
description = "Rust-powered GPS track analysis and ghost racing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "David Neurieder" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Scientific/Engineering :: GIS",
]

[tool.maturin]
python-source = "."
module-name = "against_yesterday._native"
features = ["pyo3/extension-module"]

[tool.mypy]
# The runtime floor is Python 3.9; current mypy releases no longer accept 3.9
# as an analysis target, so type-check against the next lowest supported level.
python_version = "3.10"
files = ["against_yesterday", "examples", "tests"]
strict = false
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true

[tool.ruff]
line-length = 100
exclude = [".venv", "target", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]
