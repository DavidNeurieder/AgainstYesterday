name: nightly

# The Android runs that are too slow for every PR: the newest supported API
# and a repeated full journey, to surface flakiness. Manual dispatch is
# available for on-demand checks.
#
# These jobs exercise the deterministic fake engine (USE_RUST_ENGINE is left
# unset, so the app falls back when no cdylib is present): the PR pipeline
# already cross-compiles the native engine and runs it on device.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  android:
    name: android nightly (API ${{ matrix.api-level }}, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest supported API, smoke only.
          - api-level: 36
            suite: smoke
          # Reference API, the demo journey twice, to catch flakes.
          - api-level: 34
            suite: repeat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      # The runner ships /dev/kvm, but the emulator only gets it when a udev
      # rule grants access; without it the AVD falls back to QEMU software
      # emulation and the run is far slower.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          working-directory: app
          script: |
            if [ "${{ matrix.suite }}" = "repeat" ]; then
              # The harness reinstalls the app between invocations, so the two
              # runs are isolated.
              ./tool/android_integration_test.sh
              ./tool/android_integration_test.sh
            else
              ./tool/android_integration_test.sh --smoke
            fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-artifacts-api${{ matrix.api-level }}
          path: app/build/integration-artifacts
          if-no-files-found: ignore
