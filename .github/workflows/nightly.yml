name: nightly

# The Android runs that are too slow for every PR: the full API matrix, the real
# receiver, permissions, process death, MapLibre and a repeated full journey to
# surface flakiness. PR CI's native-engine smoke is currently disabled because
# the hosted emulator times out; this workflow keeps the whole matrix. Manual
# dispatch is available for on-demand checks.
#
# These jobs exercise the deterministic fake engine by default (USE_RUST_ENGINE
# is left unset, so the app falls back when no cdylib is present). The `engine`
# suite is the exception: it cross-compiles the cdylib and runs the same demo
# journey against it, so the native engine still gets end-to-end coverage here.

on:
  workflow_dispatch:

jobs:
  android:
    name: android nightly (API ${{ matrix.api-level }}, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EMULATOR_GPU: swiftshader_indirect
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported API, smoke only (PR CI now checks API 34).
          - api-level: 24
            suite: smoke
          # Newest supported API, smoke only.
          - api-level: 36
            suite: smoke
          # Reference API, the demo journey twice, to catch flakes.
          - api-level: 34
            suite: repeat
          # Reference API, the real MapLibre map: pulls the style and tiles
          # over the network, so it lives here (nightly) and not on PRs.
          - api-level: 34
            suite: map
          # Newest API, the Android permission-state suite: broader matrix
          # coverage of the states the PR job only checks on API 34.
          - api-level: 36
            suite: permissions
          # Newest API, genuine process-death recovery.
          - api-level: 36
            suite: process-death
          # Reference API, the native Rust engine on device (see the header).
          - api-level: 34
            suite: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install the Rust Android target
        if: matrix.suite == 'engine'
        uses: ./.github/actions/setup-pinned-rust
        with:
          targets: x86_64-linux-android
      - name: Install the pinned Android NDK
        if: matrix.suite == 'engine'
        env:
          # Keep in sync with flutter.ndkVersion / ci.yml.
          ANDROID_NDK_VERSION: '28.2.13676358'
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            sdkmgr="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            (yes || true) | "$sdkmgr" --licenses > /dev/null
            (yes || true) | "$sdkmgr" "ndk;$ANDROID_NDK_VERSION"
          fi
          test -d "$ndk" || { echo "::error::NDK missing after install: $ndk"; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - run: flutter pub get
        working-directory: app
      # The runner ships /dev/kvm, but the emulator only gets it when a udev
      # rule grants access; without it the AVD falls back to QEMU software
      # emulation and the run is far slower.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # Software rendering avoids a blank/frozen window on headless runners.
          emulator-options: -no-snapshot -gpu swiftshader_indirect
          working-directory: app
          script: |
            if [ "${{ matrix.suite }}" = "repeat" ]; then
              # The harness reinstalls the app between invocations, so the two
              # runs are isolated.
              ./tool/android_integration_test.sh
              ./tool/android_integration_test.sh
            elif [ "${{ matrix.suite }}" = "map" ]; then
              # Real MapLibre map over the network (nightly-only, see above).
              ./tool/android_integration_test.sh --map-smoke
            elif [ "${{ matrix.suite }}" = "permissions" ]; then
              ./tool/android_integration_test.sh --permissions
            elif [ "${{ matrix.suite }}" = "process-death" ]; then
              ./tool/android_integration_test.sh --process-death
            elif [ "${{ matrix.suite }}" = "engine" ]; then
              # Builds the cdylib for the attached emulator's ABI (x86_64) and
              # runs the demo journey with USE_RUST_ENGINE=true. Assertions in
              # the suite also call the engine's analytics over FFI.
              make -C .. connected-test-engine
            else
              ./tool/android_integration_test.sh --smoke
            fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-artifacts-api${{ matrix.api-level }}-${{ matrix.suite }}
          path: app/build/integration-artifacts
          if-no-files-found: ignore
