name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo doc --no-deps

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  # Keeps the Android + native-engine build path honest without booting an
  # emulator: cross-compiles the cdylib per ABI and checks the FFI surface.
  android-engine-lib:
    name: engine cdylib (${{ matrix.abi }})
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: '28.2.13676358'
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust-target: aarch64-linux-android
          - abi: x86_64
            rust-target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;$ANDROID_NDK_VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Cross-compile and install
        env:
          ABIS: ${{ matrix.abi }}
        run: |
          ./app/tool/build_rust_engine_android.sh
          lib="app/android/app/src/main/jniLibs/${{ matrix.abi }}/libgps_engine.so"
          file "$lib"
          # The Dart FFI layer looks these up by name; a missing one is a
          # silent runtime failure on device, so fail the build instead.
          for sym in gps_capi_version gps_process_track gps_match_routes \
                     gps_ghost_state_at gps_create_attempt \
                     gps_generate_recording gps_last_error gps_free; do
            nm -D --defined-only "$lib" | grep -q "$sym" || {
              echo "::error::missing FFI symbol $sym in $lib"; exit 1; }
          done
          echo "all FFI symbols exported"
      - uses: actions/upload-artifact@v4
        with:
          name: libgps_engine-${{ matrix.abi }}
          path: app/android/app/src/main/jniLibs/${{ matrix.abi }}/libgps_engine.so

  android-integration-test:
    runs-on: ubuntu-latest
    needs: android-engine-lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - run: flutter pub get
        working-directory: app
      # The emulator is x86_64, so build that ABI's engine and run the whole
      # on-device suite against the real Rust engine instead of the fake one.
      - name: Build the native engine for the emulator ABI
        env:
          ABIS: x86_64
        run: ./app/tool/build_rust_engine_android.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: app
          script: flutter test integration_test --dart-define=USE_RUST_ENGINE=true
