name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo doc --no-deps

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      # Build the cdylib so rust_engine_test.dart and rust_engine_widget_test.dart
      # exercise the real engine instead of skipping.
      - run: cargo build --release -p gps-engine
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
      # The date-label assertions are timezone-independent, so running them in
      # the runner's default UTC would never reproduce a DST transition. This
      # second pass under a DST timezone is what actually exercises the
      # 23/25-hour calendar days the calendar-day fix exists for.
      - name: Run date labels under a DST timezone
        run: TZ=Europe/Berlin flutter test test/route_library_test.dart
        working-directory: app

  # Keeps the Android + native-engine build path honest without booting an
  # emulator: cross-compiles the cdylib per ABI and checks the FFI surface.
  # The runner image already ships the Android SDK and an NDK, and
  # setup-android@v3 currently fails on it ("Wrong version in preinstalled
  # sdkmanager"), so the script's own NDK discovery is used instead.
  android-engine-lib:
    name: engine cdylib (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust-target: aarch64-linux-android
          - abi: x86_64
            rust-target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - name: Show the Android SDK/NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-<unset>}"
          ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null || ls -d "${ANDROID_NDK_HOME:-/nonexistent}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Cross-compile and install
        env:
          ABIS: ${{ matrix.abi }}
        run: |
          ./app/tool/build_rust_engine_android.sh
          lib="app/android/app/src/main/jniLibs/${{ matrix.abi }}/libgps_engine.so"
          file "$lib"
          # The Dart FFI layer looks these up by name; a missing one is a
          # silent runtime failure on device, so fail the build instead.
          for sym in gps_capi_version gps_process_track gps_match_routes \
                     gps_ghost_state_at gps_create_attempt \
                     gps_generate_recording gps_last_error gps_free; do
            nm -D --defined-only "$lib" | grep -q "$sym" || {
              echo "::error::missing FFI symbol $sym in $lib"; exit 1; }
          done
          echo "all FFI symbols exported"
      - uses: actions/upload-artifact@v4
        with:
          name: libgps_engine-${{ matrix.abi }}
          path: app/android/app/src/main/jniLibs/${{ matrix.abi }}/libgps_engine.so

  android-integration-test:
    runs-on: ubuntu-latest
    needs: android-engine-lib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The emulator is x86_64, so reuse the cdylib the matrix job already built
      # and verified instead of cross-compiling it again here.
      - uses: actions/download-artifact@v4
        with:
          name: libgps_engine-x86_64
          path: app/android/app/src/main/jniLibs/x86_64
      - name: Verify the native engine was unpacked
        run: ls -l app/android/app/src/main/jniLibs/x86_64/libgps_engine.so
      - run: flutter pub get
        working-directory: app
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: app
          script: flutter test integration_test --dart-define=USE_RUST_ENGINE=true
