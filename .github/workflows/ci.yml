name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo doc --no-deps

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      # Build the cdylib so rust_engine_test.dart and rust_engine_widget_test.dart
      # exercise the real engine instead of skipping.
      - run: cargo build --release -p gps-engine
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      # The job builds the cdylib above, so a missing one is a job failure
      # rather than something the FFI suites should quietly skip over.
      - run: flutter test --dart-define=REQUIRE_RUST_ENGINE=true
        working-directory: app
      # The date-label assertions are timezone-independent, so running them in
      # the runner's default UTC would never reproduce a DST transition. This
      # second pass under a DST timezone is what actually exercises the
      # 23/25-hour calendar days the calendar-day fix exists for.
      - name: Run date labels under a DST timezone
        run: TZ=Europe/Berlin flutter test test/route_library_test.dart
        working-directory: app

  # Keeps the Android + native-engine build path honest without booting an
  # emulator: cross-compiles the cdylib per ABI and checks the FFI surface.
  # The NDK is pinned rather than left to whatever the runner image ships, so an
  # image update cannot silently change the native toolchain.
  android-engine-lib:
    name: engine cdylib (${{ matrix.abi }})
    runs-on: ubuntu-latest
    env:
      # Keep in sync with flutter.ndkVersion — FlutterExtension.kt hardcodes it,
      # and android/app/build.gradle.kts inherits it via ndkVersion =
      # flutter.ndkVersion, so Gradle demands exactly this version.
      ANDROID_NDK_VERSION: '28.2.13676358'
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust-target: aarch64-linux-android
          - abi: x86_64
            rust-target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Android NDK
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ -d "$ndk" ]; then
            echo ">> NDK $ANDROID_NDK_VERSION already present"
          else
            sdkmgr="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$sdkmgr" ]; then
              echo "::error::sdkmanager not found at $sdkmgr"; exit 1
            fi
            echo ">> Installing NDK $ANDROID_NDK_VERSION (this is ~1 GB)..."
            # sdkmanager closes stdin as soon as it has an answer, so a bare
            # `yes |` pipeline can fail with SIGPIPE after a successful
            # install under `set -o pipefail`. Swallow yes's exit inside the
            # subshell so only sdkmanager's status determines the outcome.
            (yes || true) | "$sdkmgr" --licenses > /dev/null
            (yes || true) | "$sdkmgr" "ndk;$ANDROID_NDK_VERSION"
          fi
          test -d "$ndk" || { echo "::error::NDK missing after install: $ndk"; exit 1; }
          # Exported for every later step, including the cross-compile script.
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Report toolchain versions
        run: |
          set -euo pipefail
          echo "== Android SDK =="
          echo "ANDROID_HOME=$ANDROID_HOME"
          sed -n 's/^Pkg.Revision = /cmdline-tools /p' \
            "$ANDROID_HOME/cmdline-tools/latest/source.properties" 2>/dev/null \
            || echo "(no cmdline-tools source.properties)"
          echo "== Android NDK $ANDROID_NDK_VERSION =="
          grep '^Pkg' "$ANDROID_NDK_HOME/source.properties"
          # The exact clang wrapper the build invokes: if it is absent, the
          # cross-compile would fail with a less obvious error further down.
          ls -l "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/"*/bin/aarch64-linux-android24-clang
          echo "== Rust =="
          rustc --version
          cargo --version
      - name: Cross-compile and install
        env:
          ABIS: ${{ matrix.abi }}
        run: |
          ./app/tool/build_rust_engine_android.sh
          lib="app/android/app/src/main/jniLibs/${{ matrix.abi }}/libgps_engine.so"
          file "$lib"
          # The Dart FFI layer looks these up by name; a missing one is a
          # silent runtime failure on device, so fail the build instead.
          for sym in gps_capi_version gps_process_track gps_match_routes \
                     gps_ghost_state_at gps_create_attempt \
                     gps_generate_recording gps_last_error gps_free; do
            nm -D --defined-only "$lib" | grep -q "$sym" || {
              echo "::error::missing FFI symbol $sym in $lib"; exit 1; }
          done
          echo "all FFI symbols exported"
      - uses: actions/upload-artifact@v4
        with:
          name: libgps_engine-${{ matrix.abi }}
          path: app/android/app/src/main/jniLibs/${{ matrix.abi }}/libgps_engine.so

  android-integration-test:
    name: android integration (API ${{ matrix.api-level }}, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: android-engine-lib
    # Bounds a hung emulator boot or a wedged suite; without it a stuck job
    # would sit for GitHub's 6-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full journey (demo suite, then real-receiver suite) on the
          # reference API.
          - api-level: 34
            suite: full
          # Record-and-save smoke on the oldest supported API, so every PR
          # keeps the min-SDK (24) path honest.
          - api-level: 24
            suite: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The emulator is x86_64, so reuse the cdylib the matrix job already built
      # and verified instead of cross-compiling it again here.
      - uses: actions/download-artifact@v4
        with:
          name: libgps_engine-x86_64
          path: app/android/app/src/main/jniLibs/x86_64
      - name: Verify the native engine was unpacked
        run: ls -l app/android/app/src/main/jniLibs/x86_64/libgps_engine.so
      - run: flutter pub get
        working-directory: app
      # The runner ships /dev/kvm, but the emulator only gets it when a udev
      # rule grants access. Without this the AVD silently falls back to QEMU
      # software emulation: the same three tests took 29 minutes in CI versus
      # 13 seconds on a machine with KVM.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # Pin the system-image variant, matching the AVD the harness docs
          # create, so an action/image default change cannot silently alter it.
          target: google_apis
          arch: x86_64
          working-directory: app
          # API 34 runs sequentially in one emulator session: the demo suite
          # first, then the real-receiver suite, whose harness feeds simulated
          # fixes over the emulator geo console (see
          # tool/android_integration_test.sh). The API 24 smoke job keeps only
          # the record-and-save journey.
          script: |
            if [ "${{ matrix.suite }}" = "full" ]; then
              ./tool/android_integration_test.sh --dart-define=USE_RUST_ENGINE=true
              ./tool/android_integration_test.sh --device-gps --dart-define=USE_RUST_ENGINE=true
            else
              ./tool/android_integration_test.sh --smoke --dart-define=USE_RUST_ENGINE=true
            fi
      # Preserve the app log, screenshot, and location/permission dumps a red
      # run leaves in app/build/integration-artifacts. Never skip on failure.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-integration-artifacts-api${{ matrix.api-level }}
          path: app/build/integration-artifacts
          if-no-files-found: ignore
